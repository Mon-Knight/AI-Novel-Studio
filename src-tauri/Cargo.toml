[package]
name = "ai-novel-studio"
version = "3.2.1"
description = "AI Novel Studio - Windows 桌面端 AI 小说创作工作台"
authors = ["Mon-Knight"]
license = ""
repository = "https://github.com/Mon-Knight/AI-Novel-Studio"
edition = "2021"
rust-version = "1.64"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["shell-open", "dialog-all", "fs-read-file", "fs-write-file", "notification-all", "updater", "window-close"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.19"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace]
members = ["gateway"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e = []
