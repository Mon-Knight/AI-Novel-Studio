[package]
name = "ai-novel-studio"
version = "2.1.0"
description = "AI Novel Studio - Windows 桌面端 AI 小说创作工作台"
authors = ["Mon-Knight"]
license = ""
repository = "https://github.com/Mon-Knight/AI-Novel-Studio"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["shell-open", "dialog-all", "fs-write-file", "notification-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.19"
sha2 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
