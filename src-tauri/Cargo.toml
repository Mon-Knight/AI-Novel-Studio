[package]
name = "ai-novel-studio"
version = "3.7.0"
description = "AI Novel Studio - Windows 桌面端 AI 小说创作工作台"
authors = ["Mon-Knight"]
license = ""
repository = "https://github.com/Mon-Knight/AI-Novel-Studio"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.19"
time = { version = "0.3", features = ["formatting", "macros"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[workspace]
members = ["gateway"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e = []
update-e2e = []
