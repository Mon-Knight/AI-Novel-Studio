<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Novel Studio</title>
    <script>
      performance.mark('app-html-start');
      (() => {
        const root = document.documentElement;
        const startupPath = window.location.hash.replace(/^#/, '').split('?')[0] || '/';
        root.dataset.startupLayout = startupPath === '/' ? 'workbench' : 'standard';
        const storageKey = 'ai_novel_studio_theme_preference';
        let preference = 'system';
        let systemPrefersDark = false;

        try {
          const storedPreference = window.localStorage.getItem(storageKey);
          if (
            storedPreference === 'system' ||
            storedPreference === 'light' ||
            storedPreference === 'dark'
          ) {
            preference = storedPreference;
          }
        } catch {
          preference = 'system';
        }

        try {
          systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch {
          systemPrefersDark = false;
        }

        const effectiveTheme =
          preference === 'system' ? (systemPrefersDark ? 'dark' : 'light') : preference;
        root.dataset.theme = preference;
        root.dataset.effectiveTheme = effectiveTheme;
        root.style.colorScheme = effectiveTheme;
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f6f8;
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f5f6f8;
        color: #1a1a2e;
        font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
      }

      #startup-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .startup-shell {
        display: grid;
        grid-template-columns: 56px 272px minmax(0, 1fr);
        width: 100%;
        height: 100%;
      }

      .startup-sidebar {
        border-right: 1px solid #e1e4e8;
        background: #f7f8fa;
      }

      .startup-brand {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #e1e4e8;
        color: #20242b;
      }

      .startup-brand-mark {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #2563eb;
        color: #ffffff;
        font-size: 10px;
        font-weight: 700;
      }

      .startup-nav {
        padding: 8px 0;
      }

      .startup-nav-row {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 36px;
        height: 36px;
        margin: 2px auto;
      }

      .startup-nav-icon,
      .startup-task-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        border-radius: 4px;
        background: #dce1e8;
      }

      .startup-line {
        height: 7px;
        border-radius: 4px;
        background: #d9dee5;
        animation: startup-pulse 1.25s ease-in-out infinite alternate;
      }

      .startup-line.is-short {
        width: 72px;
      }

      .startup-line.is-medium {
        width: 116px;
      }

      .startup-task-rail {
        min-width: 0;
        border-right: 1px solid #e1e4e8;
        background: #fbfbfc;
        padding: 20px 8px 12px;
      }

      .startup-task-title {
        margin: 0 10px 24px;
      }

      .startup-task-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 0 10px;
        margin-bottom: 4px;
      }

      .startup-canvas {
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }

      .startup-canvas-header {
        min-height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 24px;
        border-bottom: 1px solid #e1e4e8;
      }

      .startup-canvas-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .startup-action-dot {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: #e3e7ec;
      }

      .startup-thread {
        width: min(860px, calc(100% - 48px));
        margin: auto;
      }

      .startup-thread-row {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }

      .startup-thread-avatar {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #cfd6df;
      }

      .startup-thread-copy {
        display: grid;
        gap: 10px;
        padding-top: 3px;
      }

      .startup-thread-copy .startup-line:first-child {
        width: min(420px, 72%);
      }

      .startup-thread-copy .startup-line:last-child {
        width: min(300px, 52%);
      }

      .startup-composer {
        width: min(860px, calc(100% - 48px));
        height: 152px;
        margin: 0 auto 22px;
        border: 1px solid #d8dde5;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 4px 14px rgba(29, 38, 54, 0.06);
      }

      @keyframes startup-pulse {
        from {
          opacity: 0.48;
        }
        to {
          opacity: 0.9;
        }
      }

      @media (max-width: 820px) {
        .startup-shell {
          grid-template-columns: 56px 232px minmax(0, 1fr);
        }
      }

      @media (min-width: 1920px) {
        .startup-shell {
          grid-template-columns: 56px 304px minmax(0, 1fr);
        }

        .startup-thread,
        .startup-composer {
          width: min(900px, calc(100% - 48px));
        }
      }

      :root[data-startup-layout='standard'] .startup-shell {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      :root[data-startup-layout='standard'] .startup-task-rail,
      :root[data-startup-layout='standard'] .startup-composer {
        display: none;
      }

      :root[data-startup-layout='standard'] .startup-brand {
        justify-content: flex-start;
        gap: 10px;
        padding: 0 16px;
      }

      :root[data-startup-layout='standard'] .startup-brand::after {
        content: 'AI Novel Studio';
        font-size: 13px;
        font-weight: 600;
      }

      :root[data-startup-layout='standard'] .startup-nav-row {
        justify-content: flex-start;
        width: auto;
        margin: 2px 10px;
        padding: 0 9px;
      }

      :root[data-startup-layout='standard'] .startup-nav-row::after {
        width: 92px;
        height: 7px;
        margin-left: 11px;
        border-radius: 4px;
        background: #d9dee5;
        content: '';
        animation: startup-pulse 1.25s ease-in-out infinite alternate;
      }

      :root[data-startup-layout='standard'] .startup-canvas-header {
        min-height: 48px;
      }

      :root[data-startup-layout='standard'] .startup-thread {
        margin-top: 40px;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-line,
        :root[data-startup-layout='standard'] .startup-nav-row::after {
          animation: none;
        }
      }

      :root[data-effective-theme='dark'],
      :root[data-effective-theme='dark'] body,
      :root[data-effective-theme='dark'] #startup-splash {
        background: #1f2023;
        color: #f1f3f5;
      }

      :root[data-effective-theme='dark'] .startup-sidebar,
      :root[data-effective-theme='dark'] .startup-task-rail {
        background: #252526;
        border-color: #3c3c3c;
      }

      :root[data-effective-theme='dark'] .startup-brand,
      :root[data-effective-theme='dark'] .startup-canvas-header {
        border-color: #353940;
        color: #f1f3f5;
      }

      :root[data-effective-theme='dark'] .startup-canvas,
      :root[data-effective-theme='dark'] .startup-composer {
        background: #2d2d30;
      }

      :root[data-effective-theme='dark'] .startup-task-rail,
      :root[data-effective-theme='dark'] .startup-composer {
        border-color: #353940;
      }

      :root[data-effective-theme='dark'] .startup-nav-icon,
      :root[data-effective-theme='dark'] .startup-task-icon,
      :root[data-effective-theme='dark'] .startup-thread-avatar,
      :root[data-effective-theme='dark'] .startup-line,
      :root[data-effective-theme='dark'] .startup-action-dot {
        background: #454a52;
      }

      :root[data-effective-theme='dark'][data-startup-layout='standard'] .startup-nav-row::after {
        background: #454a52;
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="正在打开 AI Novel Studio">
      <div class="startup-shell" aria-hidden="true">
        <aside class="startup-sidebar">
          <div class="startup-brand">
            <span class="startup-brand-mark">AI</span>
          </div>
          <div class="startup-nav">
            <div class="startup-nav-row">
              <span class="startup-nav-icon"></span>
            </div>
            <div class="startup-nav-row">
              <span class="startup-nav-icon"></span>
            </div>
            <div class="startup-nav-row">
              <span class="startup-nav-icon"></span>
            </div>
          </div>
        </aside>
        <aside class="startup-task-rail">
          <div class="startup-line is-medium startup-task-title"></div>
          <div class="startup-task-row">
            <span class="startup-task-icon"></span><span class="startup-line is-medium"></span>
          </div>
          <div class="startup-task-row">
            <span class="startup-task-icon"></span><span class="startup-line is-short"></span>
          </div>
          <div class="startup-task-row">
            <span class="startup-task-icon"></span><span class="startup-line is-medium"></span>
          </div>
        </aside>
        <main class="startup-canvas">
          <div class="startup-canvas-header">
            <span class="startup-line is-medium"></span>
            <span class="startup-canvas-actions">
              <span class="startup-action-dot"></span>
              <span class="startup-action-dot"></span>
            </span>
          </div>
          <div class="startup-thread">
            <div class="startup-thread-row">
              <span class="startup-thread-avatar"></span>
              <div class="startup-thread-copy">
                <span class="startup-line"></span>
                <span class="startup-line"></span>
              </div>
            </div>
            <div class="startup-thread-row">
              <span class="startup-thread-avatar"></span>
              <div class="startup-thread-copy">
                <span class="startup-line"></span>
                <span class="startup-line"></span>
              </div>
            </div>
          </div>
          <div class="startup-composer"></div>
        </main>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
