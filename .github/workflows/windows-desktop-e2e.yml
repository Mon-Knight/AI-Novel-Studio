name: Windows desktop quality and E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tuesday 02:00 Asia/Shanghai. Scheduled workflows run from the default branch.
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: Desktop E2E suite to run
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full
          - full-three
  workflow_call:
    outputs:
      verified_sha:
        description: Commit verified by the complete prerequisite matrix
        value: ${{ jobs.quality.outputs.verified_sha }}
    inputs:
      suite:
        description: Desktop E2E suite to run before a dependent workflow
        required: false
        default: full
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Frontend, Rust, and production build
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      FULL_MATRIX: ${{ github.event_name == 'schedule' || inputs.suite == 'full' || inputs.suite == 'full-three' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      FRONTEND_OWNER: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.suite) }}
      VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
      desktop: ${{ steps.scope.outputs.desktop }}
      desktop_full: ${{ steps.scope.outputs.desktop_full }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Select applicable verification
        id: scope
        shell: pwsh
        run: |
          $selectionArgs = @('scripts/quality/verify-change.mjs', '--dry-run', '--github-output')
          if ($env:FULL_MATRIX -eq 'true') { $selectionArgs += '--full' }
          if ($env:VERIFY_BASE) { $selectionArgs += @('--base', $env:VERIFY_BASE) }
          node @selectionArgs
          exit $LASTEXITCODE
      - name: Select stable Rust
        if: steps.scope.outputs.rust == 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Cache Rust dependencies and build output
        if: steps.scope.outputs.rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-quality-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-quality-${{ runner.os }}-

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check version synchronization
        if: env.FULL_MATRIX == 'true'
        run: npm run test:version-sync

      - name: Check documentation synchronization
        if: env.FULL_MATRIX == 'true'
        run: npm run test:docs-sync

      - name: Run frontend tests with coverage gate
        if: env.FULL_MATRIX == 'true' && env.FRONTEND_OWNER == 'true'
        run: npm run test:coverage

      - name: Run lint
        if: env.FULL_MATRIX == 'true' && env.FRONTEND_OWNER == 'true'
        run: npm run lint:ci

      - name: Check component sizes
        if: env.FULL_MATRIX == 'true' && env.FRONTEND_OWNER == 'true'
        run: npm run test:component-size

      - name: Build frontend
        if: env.FULL_MATRIX == 'true' && env.FRONTEND_OWNER == 'true'
        run: npm run build

      - name: Enforce production bundle budgets
        if: env.FULL_MATRIX == 'true' && env.FRONTEND_OWNER == 'true'
        run: npm run test:bundle-size

      - name: Check Rust targets
        if: env.FULL_MATRIX == 'true'
        shell: pwsh
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --features e2e --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout pinned DSH runtime source
        if: steps.scope.outputs.rust == 'true'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .dsh-checkout
          fetch-depth: 1

      - name: Build pinned DSH host libraries
        if: steps.scope.outputs.rust == 'true'
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.7.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir .dsh-checkout install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir .dsh-checkout run build:lib:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_CHECKOUT=$env:GITHUB_WORKSPACE\.dsh-checkout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean cached novel-domain gateway
        if: env.FULL_MATRIX == 'true'
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p novel-domain-gateway

      - name: Build current novel-domain gateway
        if: env.FULL_MATRIX == 'true'
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml -p novel-domain-gateway

      - name: Run Rust tests
        if: env.FULL_MATRIX == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Verify required Rust regressions exist
        if: env.FULL_MATRIX == 'true'
        run: node scripts/quality/run-cargo-tests.mjs --list-only --filter ai_task_delete --filter project_backup_

      - name: Build production Tauri executable
        if: env.FULL_MATRIX == 'true'
        run: npm run tauri:build -- --bundles none --ci

      - name: Verify scoped native and documentation changes
        if: env.FULL_MATRIX != 'true'
        shell: pwsh
        run: |
          $selectionArgs = @('scripts/quality/verify-change.mjs', '--lane', 'native', '--report', 'test-results/verification/native.json')
          if ($env:VERIFY_BASE) { $selectionArgs += @('--base', $env:VERIFY_BASE) }
          node @selectionArgs
          exit $LASTEXITCODE

      - name: Upload native change verification evidence
        if: always() && env.FULL_MATRIX != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-change-verification
          path: test-results/verification/native.json
          if-no-files-found: warn

      - name: Export complete prerequisite evidence
        id: verified
        if: env.FULL_MATRIX == 'true' && env.FRONTEND_OWNER == 'true'
        shell: pwsh
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $env:GITHUB_SHA) { throw 'Verified checkout drifted.' }
          "sha=$actualSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  desktop-e2e:
    name: Real Windows Tauri E2E (${{ (github.event_name == 'schedule' && 'full') || inputs.suite || 'smoke' }})
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      E2E_SUITE: ${{ (github.event_name == 'schedule' && 'full') || inputs.suite || 'smoke' }}
      MSEDGEDRIVER_TELEMETRY_OPTOUT: '1'
      RUN_DESKTOP: ${{ needs.quality.outputs.desktop == 'true' || inputs.suite == 'smoke' }}
      DESKTOP_FULL: ${{ needs.quality.outputs.desktop_full }}
      VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Explain inapplicable desktop verification
        if: env.RUN_DESKTOP != 'true'
        shell: pwsh
        run: Write-Host "NOT_APPLICABLE - no desktop behavior changed; no desktop tests claimed."
      - name: Check out repository
        if: env.RUN_DESKTOP == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: env.RUN_DESKTOP == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Cache E2E Rust dependencies and build output
        if: env.RUN_DESKTOP == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .e2e-tools/target
          key: windows-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-e2e-${{ runner.os }}-

      - name: Install Node and Rust dependencies
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout pinned DSH runtime source
        if: env.RUN_DESKTOP == 'true'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .dsh-checkout
          fetch-depth: 1

      - name: Build pinned DSH host libraries
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.7.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir .dsh-checkout install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir .dsh-checkout run build:lib:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_CHECKOUT=$env:GITHUB_WORKSPACE\.dsh-checkout" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install tauri-driver 0.1.5
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".e2e-tools\tauri-driver"
          cargo install tauri-driver --version 0.1.5 --locked --root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $driver = Join-Path $root "bin\tauri-driver.exe"
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw "tauri-driver was not installed at $driver"
          }
          $installedPackages = (cargo install --list --root $root | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedPackages -notmatch "(?m)^tauri-driver v0\.1\.5:\r?$") {
            throw "Expected tauri-driver 0.1.5 in Cargo's install registry, received: $installedPackages"
          }
          "AI_NOVEL_STUDIO_E2E_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Match EdgeDriver to the installed WebView2 Runtime
        if: env.RUN_DESKTOP == 'true'
        id: edgedriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $clientId = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $registryPaths = @(
            "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientId",
            "Registry::HKEY_CURRENT_USER\Software\Microsoft\EdgeUpdate\Clients\$clientId"
          )
          $runtimeVersions = @(
            foreach ($registryPath in $registryPaths) {
              if (Test-Path -LiteralPath $registryPath) {
                $value = (Get-ItemProperty -LiteralPath $registryPath -Name pv -ErrorAction Stop).pv
                if ($value -and $value -ne "0.0.0.0") { [string]$value }
              }
            }
          )
          if ($runtimeVersions.Count -eq 0) {
            throw "Microsoft Edge WebView2 Runtime was not found in the documented registry locations."
          }
          $runtimeVersion = $runtimeVersions |
            Sort-Object { [version]$_ } -Descending |
            Select-Object -First 1
          $runtimeBuild = (($runtimeVersion -split "\.")[0..2] -join ".")

          # Keep Evergreen from changing versions between discovery and the test session.
          $policyPath = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\EdgeUpdate"
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name "Update$clientId" -PropertyType DWord -Value 0 -Force | Out-Null

          $driverRoot = Join-Path $env:GITHUB_WORKSPACE ".e2e-tools\edgedriver-$runtimeVersion"
          $archive = Join-Path $env:RUNNER_TEMP "edgedriver_win64.zip"
          $download = "https://msedgedriver.microsoft.com/$runtimeVersion/edgedriver_win64.zip"
          New-Item -ItemType Directory -Path $driverRoot -Force | Out-Null
          $downloaded = $false
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri $download -OutFile $archive -TimeoutSec 120
              $downloaded = $true
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          if (-not $downloaded) { throw "EdgeDriver download did not complete." }
          Expand-Archive -LiteralPath $archive -DestinationPath $driverRoot -Force
          $nativeDriver = Join-Path $driverRoot "msedgedriver.exe"
          if (-not (Test-Path -LiteralPath $nativeDriver -PathType Leaf)) {
            throw "EdgeDriver archive did not contain msedgedriver.exe."
          }

          $driverBanner = (& $nativeDriver --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $driverBanner -notmatch "(\d+\.\d+\.\d+\.\d+)") {
            throw "Unable to read the downloaded EdgeDriver version: $driverBanner"
          }
          $driverVersion = $Matches[1]
          $driverBuild = (($driverVersion -split "\.")[0..2] -join ".")
          if ($driverBuild -ne $runtimeBuild) {
            throw "EdgeDriver $driverVersion does not match WebView2 Runtime $runtimeVersion (expected build $runtimeBuild)."
          }

          "AI_NOVEL_STUDIO_E2E_NATIVE_DRIVER=$nativeDriver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBVIEW2_RUNTIME_VERSION=$runtimeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDGE_DRIVER_VERSION=$driverVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WebView2 Runtime: $runtimeVersion"
          "Microsoft Edge WebDriver: $driverVersion"

      - name: Prepare pinned DSH runtime carrier
        if: env.RUN_DESKTOP == 'true'
        run: npm run dsh:assets

      - name: Build the isolated E2E application
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: 'true'
          NPM_CONFIG_OFFLINE: 'true'
          VITE_AI_NOVEL_STUDIO_E2E: '1'
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE ".e2e-tools\target"
          node node_modules/@tauri-apps/cli/tauri.js build --features e2e --bundles none --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify WebView2 and EdgeDriver still match
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        run: |
          $clientId = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $paths = @(
            "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientId",
            "Registry::HKEY_CURRENT_USER\Software\Microsoft\EdgeUpdate\Clients\$clientId"
          )
          $versions = @(
            foreach ($path in $paths) {
              if (Test-Path -LiteralPath $path) {
                $value = (Get-ItemProperty -LiteralPath $path -Name pv -ErrorAction Stop).pv
                if ($value -and $value -ne "0.0.0.0") { [string]$value }
              }
            }
          )
          $current = $versions | Sort-Object { [version]$_ } -Descending | Select-Object -First 1
          if (-not $current) { throw "WebView2 Runtime disappeared before E2E execution." }
          $currentBuild = (($current -split "\.")[0..2] -join ".")
          $driverBuild = (($env:EDGE_DRIVER_VERSION -split "\.")[0..2] -join ".")
          if ($currentBuild -ne $driverBuild) {
            throw "WebView2 changed to $current after EdgeDriver $env:EDGE_DRIVER_VERSION was provisioned."
          }

      - name: Run real desktop E2E without dependency downloads
        if: env.RUN_DESKTOP == 'true'
        shell: pwsh
        env:
          AI_NOVEL_STUDIO_E2E_SKIP_BUILD: '1'
          CARGO_NET_OFFLINE: 'true'
          NPM_CONFIG_OFFLINE: 'true'
        run: |
          if ($env:VERIFY_BASE) {
            node scripts/quality/verify-change.mjs --base $env:VERIFY_BASE --lane desktop --report test-results/verification/desktop.json
            exit $LASTEXITCODE
          }
          $command = if ($env:E2E_SUITE -eq "smoke" -and $env:DESKTOP_FULL -ne 'true') { "test:e2e:smoke" } else { "test:e2e" }
          $repeat = if ($env:E2E_SUITE -eq "full-three") { 3 } else { 1 }
          foreach ($run in 1..$repeat) {
            Write-Host "Running $command ($run/$repeat)"
            npm run $command
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload E2E failure diagnostics
        if: failure() && env.RUN_DESKTOP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 7
