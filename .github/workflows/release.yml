name: Windows signed release and channel rollback

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: write

jobs:
  release-context:
    name: Validate semantic version and channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select validated release channel
        id: channel
        shell: bash
        env:
          REQUESTED_RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release/select-release-channel.mjs >> "$GITHUB_OUTPUT"

  desktop-gate:
    name: Required Windows desktop quality and E2E
    needs: release-context
    uses: ./.github/workflows/windows-desktop-e2e.yml
    with:
      suite: full

  windows-release:
    needs: [desktop-gate, release-context]
    runs-on: windows-2022
    timeout-minutes: 90
    concurrency:
      group: release-channel-${{ needs.release-context.outputs.channel }}
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: ${{ needs.release-context.outputs.channel }}
      VERIFIED_SHA: ${{ needs.desktop-gate.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select pinned Rust
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $toolchain) { throw 'Unable to read the pinned Rust toolchain.' }
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm run test:version-sync
      - name: Require evidence for the exact release commit
        shell: pwsh
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $env:VERIFIED_SHA -or $actualSha -ne $env:VERIFIED_SHA) {
            throw 'The successful full desktop gate does not verify this release commit.'
          }

      - name: Clean cached novel-domain gateway
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p novel-domain-gateway

      - name: Build current novel-domain gateway
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml -p novel-domain-gateway

      - name: Prepare signed updater configuration
        shell: pwsh
        env:
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_PUBLIC_KEY)) {
            throw 'Missing repository secret TAURI_PUBLIC_KEY.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing repository secret TAURI_PRIVATE_KEY.'
          }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }

          $channelEndpoint = "https://github.com/Mon-Knight/AI-Novel-Studio/releases/download/updates-$env:RELEASE_CHANNEL/latest.json"
          $releaseConfig = @{
            plugins = @{
              updater = @{
                endpoints = @($channelEndpoint)
                pubkey = $env:TAURI_PUBLIC_KEY
                requireSignedVersion = $true
                windows = @{
                  installMode = 'passive'
                  installerArgs = @()
                }
              }
            }
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-release.conf.json'
          $releaseConfig | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8
          "TAURI_RELEASE_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installers and signed updater archives
        shell: pwsh
        env:
          # Tauri 2 reads the TAURI_SIGNING_* variables. Repository secrets keep
          # their historical names so existing environments do not need to be renamed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        # MSI remains the signed updater source so existing installs keep a
        # stable update URL. NSIS adds the user-facing *-setup.exe installer.
        run: npm run tauri:build:release -- --config "$env:TAURI_RELEASE_CONFIG"

      - name: Enforce signed build bundle budgets
        run: npm run test:bundle-size

      - name: Verify Tauri 2 v1Compatible artifacts and signatures
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $json = node scripts/release/select-release-artifacts.mjs `
            --bundle-root 'src-tauri/target/release/bundle' `
            --config 'src-tauri/tauri.conf.json' `
            --version $version | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Tauri 2 v1Compatible artifact selection failed.' }
          $selection = $json | ConvertFrom-Json
          $selection | ConvertTo-Json -Depth 6
          "RELEASE_UPDATER_PATH=$($selection.updater.path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_UPDATER_SIGNATURE_PATH=$($selection.updater.signaturePath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_INSTALLER_PATH=$($selection.installer.path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri channel and rollback manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $updaterBundle = $env:RELEASE_UPDATER_PATH
          $signature = $env:RELEASE_UPDATER_SIGNATURE_PATH
          $installer = $env:RELEASE_INSTALLER_PATH
          foreach ($value in @($updaterBundle, $signature, $installer)) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw 'Verified release artifact paths are missing.'
            }
          }

          $previousJson = node scripts/release/publish-channel.mjs --previous
          if ($LASTEXITCODE -ne 0) { throw 'Failed to verify the current channel and rollback target.' }
          $previous = $previousJson | ConvertFrom-Json

          $arguments = @(
            'scripts/release/build-release-manifest.mjs',
            '--version', $version,
            '--channel', $env:RELEASE_CHANNEL,
            '--artifact', $updaterBundle,
            '--signature', $signature,
            '--installer', $installer
          )
          $notesFile = "dist-release/release-notes-v$version.md"
          node scripts/release/extract-release-notes.mjs --version $version --output $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract release notes.' }
          $arguments += @('--notes-file', (Resolve-Path $notesFile).Path)
          if ($previous.previousVersion) {
            $arguments += @('--previous-version', $previous.previousVersion)
            $arguments += @('--previous-installer-url', $previous.previousInstallerUrl)
          }
          node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build validated channel metadata.' }

      - name: Verify immutable tagged release or first publication
        id: tag_preflight
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $result = node scripts/release/publish-channel.mjs --check-tag
          if ($LASTEXITCODE -ne 0) { throw 'Existing tagged release differs or remote preflight failed.' }
          $result | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ai-novel-studio-${{ env.RELEASE_CHANNEL }}-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/**
            dist-release/channels/**
            dist-release/release-notes-*.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.tag_preflight.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.RELEASE_CHANNEL == 'beta' }}
          body_path: dist-release/release-notes-${{ github.ref_name }}.md
          files: |
            src-tauri/target/release/bundle/**/*
            dist-release/channels/${{ env.RELEASE_CHANNEL }}/release.json
            dist-release/channels/${{ env.RELEASE_CHANNEL }}/rollback.json

      - name: Publish rolling channel index
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/publish-channel.mjs --publish
          if ($LASTEXITCODE -ne 0) { throw 'Channel publication or verified metadata recovery failed; inspect the preceding error.' }
